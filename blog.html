<script language="javascript">
    window.mv = {
        corporaHost: 'https://corpora.library.tamu.edu',
        corpusID: '66d0cf276083e79367c617c6',
        urlParams: new URLSearchParams(window.location.search),
        blogPage: 1,
        blogPageSize: 5,
        totalBlogPosts: 0
    }
    window.mv['api'] = `${mv.corporaHost}/api/corpus/${mv.corpusID}`

    // load footer
    getEl('footer').innerHTML = mvTemplates.footer()

    // MAIN ENTRY POINT
    document.addEventListener('DOMContentLoaded', function() {
        mv.blogPage = mv.urlParams.get('blog-page')
        if (!mv.blogPage) mv.blogPage = 1

        callAPI(`${mv.api}/BlogPost/`, {
            'page-size': mv.blogPageSize,
            'page': mv.blogPage,
            's_publication_date': 'desc'
        }, data => {
            if (data.meta && data.records) {
                mv.totalBlogPosts = data.meta.total
                let postHolder = getEl('post-holder')

                data.records.forEach(post => {
                    appendToEl(postHolder, `
                        <section class="boilerplate-page-section blog-post">
                            <div class="page-section-header">${formatShortDate(post.publication_date)}</div>
                            <div class="page-section-content">
                                <h2>${post.title}</h2>
                                ${post.content}
                            </div>
                        </section>
                    `)
                })

                renderBlogPager()
            }
        })
    })

    function renderBlogPager() {
        let page = parseInt(mv.blogPage) || 1
        let hasOlder = page * mv.blogPageSize < mv.totalBlogPosts
        let hasNewer = page > 1

        if (hasOlder || hasNewer) {
            appendToEl(getEl('post-holder'), `
                <nav class="boilerplate-page-section blog-pager">
                    <div class="page-section-header no-border"></div>
                    <div class="page-section-content">
                        ${hasOlder ? `<a href="blog.html?blog-page=${page + 1}" class="link-button blog-pager-older">Older Posts</a>` : ''}
                        ${hasNewer ? `<a href="blog.html?blog-page=${page - 1}" class="link-button blog-pager-newer">Newer Posts</a>` : ''}
                    </div>
                </nav>
            `)
        }
    }

</script>
